# Managed by agent-security. install.sh refuses to overwrite a file without this line.
#
# Installed to /etc/codex/requirements.toml. Requirements are the part of Codex's
# configuration that users cannot override: a conflicting value in ~/.codex/config.toml or on
# the command line is replaced, or Codex refuses to load the file. They are Codex's
# equivalent of Claude Code's managed settings.
#
# The credential list, the .env rules and the allowed hosts mirror
# claude/managed-settings.d/10-agent-security.json; tests/consistency.py keeps them equal.

# Only the managed profile below can be used; the built-in profiles are left out. Leaving out
# `:danger-full-access` also keeps `--dangerously-bypass-approvals-and-sandbox` from leaving the
# sandbox.
default_permissions = "agent-security"

# No command leaves the sandbox, as with Claude Code's `allowUnsandboxedCommands: false`. The
# granular policy is on-request without sandbox escalation prompts: those ask to run a command
# outside the sandbox, which would also skip the network proxy. `never`, which codex exec uses,
# asks for nothing. config.toml sets the granular policy as the default.
allowed_approval_policies = [
  { granular = { sandbox_approval = false, rules = true, mcp_elicitations = true, request_permissions = true, skill_approval = true } },
  "never",
]

[allowed_permission_profiles]
"agent-security" = true

# Locations no profile, setting or flag can open for reading. `~` is the user's home.
[permissions.filesystem]
deny_read = [
  "~/.ssh",
  "~/.aws",
  "~/.azure",
  "~/.config/gcloud",
  "~/.kube",
  "~/.gnupg",
  "~/.password-store",
  "~/.config/op",
  "~/.config/gh",
  "~/.local/share/keyrings",
  "~/.mozilla",
  "~/.config/google-chrome",
  "~/.config/chromium",
  "~/Library/Keychains",
  "~/Library/Application Support/Google/Chrome",
  "~/Library/Application Support/Firefox",
  "~/.docker/config.json",
  "~/.netrc",
  "~/.git-credentials",
  "~/.config/git/credentials",
  "~/.cache/git/credential",
  "~/.npmrc",
  "~/.pypirc",
  "~/.vault-token",
  "~/.terraform.d/credentials.tfrc.json",
  "~/.bash_history",
  "~/.zsh_history",
  "~/.claude/.credentials.json",
  "~/.codex/auth.json",
]

# This profile is defined only in requirements.toml. Codex rejects a user or project
# configuration that defines another profile with the same name.
[permissions.agent-security]
description = "Workspace and package-cache write access; environment files denied; network limited to code hosting, package registries and hosts the user allows."
extends = ":workspace"

[permissions.agent-security.filesystem]
# Codex expands the .env patterns of this profile when a command starts, down to this many
# directories below the pattern's fixed part. Deeper files are not covered.
glob_scan_max_depth = 6
# Environment files (.env, .env.*, and direnv's .envrc) outside the workspace, in the home
# directory. Codex stops every command when the scan meets a directory it cannot read, so /tmp,
# which always holds such directories on Linux, is left out (Claude Code covers it).
"~/**/.env" = "deny"
"~/**/.env.*" = "deny"
"~/**/.envrc" = "deny"
# Package-manager caches, so installs and builds work. Only the cache folders: the tools'
# settings next to them (~/.gradle/init.d, ~/.m2/settings.xml, ~/.cargo/config.toml, ...) can run
# code or hold credentials and stay read-only.
"~/.npm" = "write"
"~/.cache/yarn" = "write"
"~/.yarn/berry/cache" = "write"
"~/.local/share/pnpm/store" = "write"
"~/.bun/install/cache" = "write"
"~/.cache/pip" = "write"
"~/.cache/uv" = "write"
"~/.cache/pypoetry" = "write"
"~/.cargo/registry" = "write"
"~/.cargo/git" = "write"
"~/go/pkg/mod" = "write"
"~/.cache/go-build" = "write"
"~/.m2/repository" = "write"
"~/.gradle/caches" = "write"
"~/.gradle/wrapper" = "write"
"~/.nuget/packages" = "write"
"~/.cache/composer" = "write"
"~/Library/Caches/Yarn" = "write"
"~/Library/pnpm/store" = "write"
"~/Library/Caches/pip" = "write"
"~/Library/Caches/pypoetry" = "write"
"~/Library/Caches/go-build" = "write"
"~/Library/Caches/composer" = "write"

# Environment files anywhere in the workspace. Open .git for commits, keeping configuration and
# automatic scripts read-only.
[permissions.agent-security.filesystem.":workspace_roots"]
"**/.env" = "deny"
"**/.env.*" = "deny"
"**/.envrc" = "deny"
".git" = "write"
".git/config" = "read"
".git/hooks" = "read"

[permissions.agent-security.network]
enabled = true

# Commands reach the network only through Codex's managed proxy, which allows these hosts, the
# same patterns as Claude Code's sandbox.network.allowedDomains. `*.` matches subdomains only.
# Users can add hosts with `network_rule(...)` in a rules file of their own (~/.codex/rules/), but
# cannot turn the proxy off or open local addresses, local sockets or the proxy's listener.
[experimental_network]
enabled = true
managed_allowed_domains_only = false
allow_local_binding = false
dangerously_allow_all_unix_sockets = false
dangerously_allow_non_loopback_proxy = false

[experimental_network.domains]
"github.com" = "allow"
"*.github.com" = "allow"
"*.githubusercontent.com" = "allow"
"gitlab.com" = "allow"
"registry.npmjs.org" = "allow"
"registry.yarnpkg.com" = "allow"
"repo.yarnpkg.com" = "allow"
"pypi.org" = "allow"
"files.pythonhosted.org" = "allow"
"crates.io" = "allow"
"index.crates.io" = "allow"
"static.crates.io" = "allow"
"static.rust-lang.org" = "allow"
"proxy.golang.org" = "allow"
"sum.golang.org" = "allow"
"rubygems.org" = "allow"
"index.rubygems.org" = "allow"
"repo.maven.apache.org" = "allow"
"repo1.maven.org" = "allow"
"plugins.gradle.org" = "allow"
"services.gradle.org" = "allow"
"downloads.gradle.org" = "allow"
"api.nuget.org" = "allow"
"repo.packagist.org" = "allow"

# Managed hooks run without the per-user /hooks trust step and cannot be disabled by users,
# who can still add their own hooks next to them.
[features]
hooks = true

[hooks]
managed_dir = "/opt/agent-security/bin"

[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "/opt/agent-security/bin/agent-secret-scan"
timeout = 10
statusMessage = "Scanning prompt for credentials"

[[hooks.PreToolUse]]
matcher = ""

[[hooks.PreToolUse.hooks]]
type = "command"
command = "/opt/agent-security/bin/agent-secret-scan"
timeout = 10
statusMessage = "Scanning tool call for credentials"

# Exit code 2 on PostToolUse replaces the tool result with the scanner's message, so a result
# that contains a credential does not reach the model.
[[hooks.PostToolUse]]
matcher = ""

[[hooks.PostToolUse.hooks]]
type = "command"
command = "/opt/agent-security/bin/agent-secret-scan"
timeout = 10
statusMessage = "Scanning tool output for credentials"

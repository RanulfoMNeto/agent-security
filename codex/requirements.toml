# Managed by agent-security. install.sh refuses to overwrite a file without this line.
#
# Installed to /etc/codex/requirements.toml. Requirements are the part of Codex's
# configuration that users cannot override: a conflicting value in ~/.codex/config.toml or on
# the command line is replaced, or Codex refuses to load the file. They are Codex's
# equivalent of Claude Code's managed settings.
#
# The credential list below mirrors the `Read(...)` rules in
# claude/managed-settings.d/10-agent-security.json (except the .env rules, which are in
# config.toml); tests/consistency.py keeps them equal.

# Only the profile defined in config.toml and the read-only profile can be used.
# `:danger-full-access` is left out, which also keeps `--dangerously-bypass-approvals-and-sandbox`
# from leaving the sandbox.
default_permissions = "agent-security"

# No command leaves the sandbox, as with Claude Code's `allowUnsandboxedCommands: false`. The
# granular policy is on-request without sandbox escalation prompts: those ask to run a command
# outside the sandbox, which would also skip the network proxy. `never`, which codex exec uses,
# asks for nothing. config.toml sets the granular policy as the default.
allowed_approval_policies = [
  { granular = { sandbox_approval = false, rules = true, mcp_elicitations = true, request_permissions = true, skill_approval = true } },
  "never",
]

[allowed_permission_profiles]
"agent-security" = true
":read-only" = true

# Locations no profile, setting or flag can open for reading. `~` is the user's home.
[permissions.filesystem]
deny_read = [
  "~/.ssh",
  "~/.aws",
  "~/.azure",
  "~/.config/gcloud",
  "~/.kube",
  "~/.gnupg",
  "~/.password-store",
  "~/.config/op",
  "~/.config/gh",
  "~/.local/share/keyrings",
  "~/.mozilla",
  "~/.config/google-chrome",
  "~/.config/chromium",
  "~/Library/Keychains",
  "~/Library/Application Support/Google/Chrome",
  "~/Library/Application Support/Firefox",
  "~/.docker/config.json",
  "~/.netrc",
  "~/.git-credentials",
  "~/.config/git/credentials",
  "~/.cache/git/credential",
  "~/.npmrc",
  "~/.pypirc",
  "~/.vault-token",
  "~/.terraform.d/credentials.tfrc.json",
  "~/.bash_history",
  "~/.zsh_history",
  "~/.claude/.credentials.json",
  "~/.codex/auth.json",
]

# Recursive deletion is refused, as Claude Code's `Bash(rm -r *)` deny rules do.
# tests/consistency.py keeps the two lists of flags equal.
[rules]
prefix_rules = [
  { pattern = [{ token = "rm" }, { any_of = ["-r", "-rf", "-fr", "-R", "--recursive"] }], decision = "forbidden", justification = "Recursive deletion is denied by the agent-security policy." },
]

# Managed hooks run without the per-user /hooks trust step and cannot be disabled by users,
# who can still add their own hooks next to them.
#
# The agent-security profile turns command network access on, and only the network proxy
# applies its domain rules: without the proxy, those commands would reach every host. Pinning
# the feature here keeps users from turning the proxy off.
[features]
hooks = true
network_proxy = true

[hooks]
managed_dir = "/opt/agent-security/bin"

[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "/opt/agent-security/bin/agent-secret-scan"
timeout = 10
statusMessage = "Scanning prompt for credentials"

[[hooks.PreToolUse]]
matcher = ""

[[hooks.PreToolUse.hooks]]
type = "command"
command = "/opt/agent-security/bin/agent-secret-scan"
timeout = 10
statusMessage = "Scanning tool call for credentials"

# Exit code 2 on PostToolUse replaces the tool result with the scanner's message, so a result
# that contains a credential does not reach the model.
[[hooks.PostToolUse]]
matcher = ""

[[hooks.PostToolUse.hooks]]
type = "command"
command = "/opt/agent-security/bin/agent-secret-scan"
timeout = 10
statusMessage = "Scanning tool output for credentials"

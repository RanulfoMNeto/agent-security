# Managed by agent-security. install.sh refuses to overwrite a file without this line.
#
# Installed to /etc/codex/config.toml. These are defaults that user configuration can override,
# within the limits in requirements.toml. The permission profile is defined only there.

# On-request approvals without sandbox escalation prompts; requirements.toml allows only this
# policy and `never`.
approval_policy = { granular = { sandbox_approval = false, rules = true, mcp_elicitations = true, request_permissions = true, skill_approval = true } }

[shell_environment_policy]
# Codex requirements do not support shell_environment_policy; keep this default here.
# Remove variables whose names contain KEY, SECRET or TOKEN from command environments, and the
# variables Claude Code's policy removes that those words do not match. tests/consistency.py
# checks that every variable removed for Claude Code is removed here too.
ignore_default_excludes = false
exclude = ["TWINE_PASSWORD", "GOOGLE_APPLICATION_CREDENTIALS", "SLACK_WEBHOOK_URL", "BW_SESSION", "SSH_AUTH_SOCK"]
